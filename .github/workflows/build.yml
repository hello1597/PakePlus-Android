name: Android Build

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'App name (用于 Release 标题和文件名)'
        required: true
        default: 'MyApp'
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      pubbody:
        description: 'Release 说明'
        required: false
        default: 'Automated build'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      NAME: ${{ github.event.inputs.name }}
      VERSION: ${{ github.event.inputs.version }}
      PUBBODY: ${{ github.event.inputs.pubbody }}
      # 临时强制 Node.js 20 的 Actions 在 Node 24 下运行（兜底）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      # 明确允许 pnpm 运行构建脚本（安全策略覆盖）
      PNPM_IGNORE_SCRIPTS: false

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout Repository
        uses: actions/checkout@v6

      # ---------- 2. 设置 JDK ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ---------- 3. 设置 Android SDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ---------- 4. 设置 Node.js ----------
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      # ---------- 5. 设置 pnpm ----------
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      # ---------- 6. 缓存 pnpm 依赖 ----------
      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ---------- 7. 安装依赖及初始化 ----------
      - name: Install dependencies
        run: |
          # 强制运行构建脚本（sharp 需要编译）
          pnpm install --frozen-lockfile --config.ignore-scripts=false
          pnpm pp:worker

      # ---------- 8. 赋予 Gradle 执行权限 ----------
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # ---------- 9. 构建 Debug APK ----------
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ---------- 10. 重命名 APK ----------
      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk

      # ---------- 11. 创建 GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: '${{ env.NAME }}-v${{ env.VERSION }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
