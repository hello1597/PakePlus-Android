steps:
  - name: Checkout Repository
    uses: actions/checkout@v6  # 从 v4 升级到 v6

  - name: Set up JDK 17
    uses: actions/setup-java@v4  # 从 v3 升级到 v4
    with:
      distribution: 'temurin'
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3  # 暂时保持，留意后续更新

  - name: Set up Node.js
    uses: actions/setup-node@v6  # 从 v4 升级到 v6
    with:
      node-version: 22  # 你的项目构建环境仍可使用 Node.js 22

  - name: Set up pnpm
    uses: pnpm/action-setup@v6  # 从 v4 升级到 v6，这是关键！
    with:
      version: latest
