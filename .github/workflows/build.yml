name: Android Build

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'App name (用于 Release 标题和文件名)'
        required: true
        default: 'MyApp'
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      pubbody:
        description: 'Release 说明'
        required: false
        default: 'Automated build'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    env:
      NAME: ${{ github.event.inputs.name }}
      VERSION: ${{ github.event.inputs.version }}
      PUBBODY: ${{ github.event.inputs.pubbody }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PNPM_ONLY_BUILT_DEPENDENCIES: false   # 允许 sharp 等包运行安装脚本

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: latest

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ---------- 修复：允许 sharp 构建 ----------
      - name: Install dependencies
        run: |
          PNPM_SUPPLY_CHAIN=off pnpm install --frozen-lockfile --config.ignore-scripts=false
          pnpm pp:worker

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: '${{ env.NAME }}-v${{ env.VERSION }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
