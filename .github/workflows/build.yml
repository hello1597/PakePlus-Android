name: Android Build

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'App name (用于 Release 标题和文件名)'
        required: true
        default: 'MyApp'
      version:
        description: '版本号 (如 1.0.0)'
        required: true
        default: '1.0.0'
      pubbody:
        description: 'Release 说明'
        required: false
        default: 'Automated build'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    # 环境变量：从输入获取，供后续步骤使用
    env:
      NAME: ${{ github.event.inputs.name }}
      VERSION: ${{ github.event.inputs.version }}
      PUBBODY: ${{ github.event.inputs.pubbody }}
      # 临时强制 Node.js 20 的 Actions 在 Node 24 下运行（安全性兜底，可删除）
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # ---------- 1. 检出代码 ----------
      - name: Checkout Repository
        uses: actions/checkout@v6   # 已支持 Node 24

      # ---------- 2. 设置 JDK ----------
      - name: Set up JDK 17
        uses: actions/setup-java@v5   # 升级到 v5，支持 Node 24
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      # ---------- 3. 设置 Android SDK ----------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4   # 升级到 v4，支持 Node 24

      # ---------- 4. 设置 Node.js ----------
      - name: Set up Node.js
        uses: actions/setup-node@v6   # 支持 Node 24
        with:
          node-version: 22           # 与本地开发环境一致

      # ---------- 5. 设置 pnpm ----------
      - name: Set up pnpm
        uses: pnpm/action-setup@v6   # 升级到 v6，支持 Node 24
        with:
          version: latest            # 或固定版本如 '11'

      # ---------- 6. 缓存 pnpm 依赖 ----------
      - name: Cache pnpm store
        uses: actions/cache@v5       # 升级到 v5，支持 Node 24
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # ---------- 7. 安装依赖及初始化 ----------
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm pp:worker   # 你的自定义脚本

      # ---------- 8. 赋予 Gradle 执行权限 ----------
      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      # ---------- 9. 构建 Debug APK ----------
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # ---------- 10. 重命名 APK ----------
      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk

      # ---------- 11. 创建 GitHub Release ----------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2   # 该 Action 仍基于 Node 20，但由 FORCE 变量支持运行
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: '${{ env.NAME }}-v${{ env.VERSION }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
