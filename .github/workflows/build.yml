name: Android Build

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - 'main'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ---------- 修改处 ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22      # 改为 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4   # 升级到 v4
        with:
          version: latest       # 保持最新（兼容 Node 22）
      # ---------------------------

      - name: Init Project Config
        run: |
          pnpm install --frozen-lockfile   # 推荐加 --frozen-lockfile
          pnpm pp:worker

      - name: Grant Execute Permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK file
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk ${{ env.NAME }}-v${{ env.VERSION }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          tag_name: '${{ env.NAME }}'
          name: '${{ env.NAME }} v${{ env.VERSION }}'
          body: '${{ env.PUBBODY }}'
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ env.NAME }}
          VERSION: ${{ env.VERSION }}
          PUBBODY: ${{ env.PUBBODY }}
